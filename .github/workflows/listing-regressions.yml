name: Listing regression checks
on:
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.*'
      - 'firebase/functions/**'
      - '.github/workflows/listing-regressions.yml'
  push:
    branches:
      - fix/listing-category-and-multiple-photos
concurrency:
  group: listing-regressions-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.1'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json
      - run: npm ci
      - run: npm run build
